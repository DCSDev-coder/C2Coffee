name: c2_coffee
description: "A new Flutter project for C2 Coffee."
publish_to: 'none'

version: 1.0.1+27

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Pick image from gallery/camera
  image_picker: ^1.2.0

  # International phone field with country flags
  intl_phone_field: ^3.2.0

  # Date formatting
  intl: ^0.20.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^19.5.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.5
  share_plus: ^12.0.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_app_2_1024.png"
  remove_alpha_ios: true

flutter:
  # geolocator_apple's Swift package currently compiles the background-location
  # selector unconditionally. Keep CocoaPods for now so the Podfile can apply
  # BYPASS_PERMISSION_LOCATION_ALWAYS and the App Store does not require an
  # unnecessary Always location purpose string.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
  - assets/images/
  - assets/images/OrderStatus/

  fonts:
    - family: Recoleta
      fonts:
        - asset: assets/fonts/Recoleta Alt Bold.otf

    - family: Afacad
      fonts:
        - asset: assets/fonts/Afacad-Regular.ttf
        - asset: assets/fonts/Afacad-Medium.ttf
          weight: 500
        - asset: assets/fonts/Afacad-SemiBold.ttf
          weight: 600
