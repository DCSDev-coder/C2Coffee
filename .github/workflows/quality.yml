name: C2 Coffee quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [api, admin_web, edge_server]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: API checks
        if: matrix.project == 'api'
        run: npm run typecheck && npm run build && node --test test/*.test.mjs
      - name: Admin Web checks
        if: matrix.project == 'admin_web'
        run: npm run lint && npm test && npm run build
      - name: Print connector checks
        if: matrix.project == 'edge_server'
        run: npm test

  flutter-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [mobile_app, barista_app, counter_app]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
