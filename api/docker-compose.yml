services:
  c2-api:
    build: .
    container_name: c2coffee-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # IIS is the only public entry point. Keep Fastify unreachable directly
      # from the network so TLS, request filtering, and proxy logging apply.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./public/menu/uploads:/app/dist/public/menu/uploads
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
